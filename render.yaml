services:
  - type: web
    name: ai-document-intelligence-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["http://localhost:3000","https://lidu12.github.io"]'

  - type: static
    name: ai-document-intelligence-ui
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://ai-document-intelligence-assistant-1.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
